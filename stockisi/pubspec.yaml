name: stockisi
description: "Stockisi - aplikasi WMS mobile untuk operator gudang manufaktur."
publish_to: 'none'
version: 0.1.0+1

environment:
  # Dilonggarkan dari ^3.13.7 supaya bisa dijalankan di Flutter 3.44.5
  # (Dart 3.12.2). Semua dependency sudah dicek: tidak ada yang butuh
  # Dart di atas 3.12.2, dan ^3.12.2 tetap menerima 3.13.7+.
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Hanya aset font. Diperlukan karena framework merujuk CupertinoIcons
  # lewat transisi halaman iOS; tanpa package ini `flutter build web`
  # memunculkan peringatan "Expected to find fonts for (... CupertinoIcons)".
  cupertino_icons: ^1.0.8
  # Menggambar QR Label barang (layar 10) di klien, tanpa layanan gambar
  # daring. Hanya encoder, tidak ada akses kamera.
  barcode: ^2.2.9
  flutter_secure_storage: ^11.2.0
  # ^0.20.2 menerima 0.20.2 (dipin oleh flutter_localizations di Flutter
  # 3.44.5) maupun 0.20.3 (dipin di Flutter 3.47.9).
  intl: ^0.20.2
  mobile_scanner: ^7.5.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
